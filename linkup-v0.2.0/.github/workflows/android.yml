name: LinkUp Android CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ui/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Shared logic tests
        run: node --test tests/test_activity.mjs tests/test_cloud.mjs
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        working-directory: android
        run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash -c 'cd android; gradle :app:connectedDebugAndroidTest; rc=$?; adb logcat -d > ../android-logcat.txt || true; exit "$rc"'
      - name: Test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-diagnostics
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android-logcat.txt
          if-no-files-found: warn
      - name: Tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
