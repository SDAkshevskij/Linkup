name: LinkUp release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected versionName from the reviewed main commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: linkup-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'SDAkshevskij/Linkup'
    uses: ./.github/workflows/android.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'SDAkshevskij/Linkup'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: linkup-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual=$(sed -n 's/^versionName=//p' linkup-v0.2.0/version.properties)
          test "$EXPECTED_VERSION" = "$actual"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build unsigned release
        working-directory: linkup-v0.2.0/android
        run: gradle :app:assembleRelease
      - name: Sign and verify release APK
        env:
          LINKUP_KEYSTORE_BASE64: ${{ secrets.LINKUP_KEYSTORE_BASE64 }}
          LINKUP_KEYSTORE_PASSWORD: ${{ secrets.LINKUP_KEYSTORE_PASSWORD }}
        run: bash linkup-v0.2.0/tools/prepare-release.sh
      - name: Verify version and signer continuity against published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash linkup-v0.2.0/tools/verify-release-history.sh
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: linkup-v0.2.0
        run: |
          set -euo pipefail
          code=$(sed -n 's/^versionCode=//p' version.properties)
          tag=v$(sed -n 's/^versionName=//p' version.properties)
          existing_tag=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -n $existing_tag ]]; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/linkup-release"
          sha256sum -c SHA256SUMS
          awk -v version="## $tag" '
            /^## / { if (show) exit; show = ($0 == version || index($0, version " — ") == 1); next }
            show { print }
          ' "$GITHUB_WORKSPACE/CHANGELOG.md" > release-notes.md
          test -s release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --notes-file release-notes.md \
            "LinkUp-Android-$code.apk" "LinkUp-Linux-$code.zip" SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
