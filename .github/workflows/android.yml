name: LinkUp Android CI
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'linkup-v0.2.0/android/**'
      - 'linkup-v0.2.0/ui/**'
      - 'linkup-v0.2.0/linux/**'
      - 'linkup-v0.2.0/tools/**'
      - 'linkup-v0.2.0/version.properties'
      - '.github/workflows/release.yml'
      - 'linkup-v0.2.0/tests/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'linkup-v0.2.0/android/**'
      - 'linkup-v0.2.0/ui/**'
      - 'linkup-v0.2.0/linux/**'
      - 'linkup-v0.2.0/tools/**'
      - 'linkup-v0.2.0/version.properties'
      - '.github/workflows/release.yml'
      - 'linkup-v0.2.0/tests/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Shared logic tests
        working-directory: linkup-v0.2.0
        run: node --test tests/*.mjs
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and lint
        working-directory: linkup-v0.2.0/android
        run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash -c 'cd linkup-v0.2.0/android; bash ../tools/test-android-mobile.sh && bash ../tools/test-android-upgrade.sh; rc=$?; adb logcat -d > ../android-logcat.txt || true; exit "$rc"'
      - name: Test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-diagnostics
          path: |
            linkup-v0.2.0/android/app/build/reports/
            linkup-v0.2.0/android/app/build/outputs/androidTest-results/
            linkup-v0.2.0/android/app/build/mobile-diagnostics/
            linkup-v0.2.0/android-logcat.txt
          if-no-files-found: warn
      - name: Tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinkUp-Android-debug
          path: linkup-v0.2.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt WebEngine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5.qtwebengine python3-pyqt5.qtwebchannel xvfb xauth libgl1-mesa-dri
      - name: Linux agent and packaged upgrade tests
        working-directory: linkup-v0.2.0
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          LINKUP_TEST_WEBENGINE: '1'
        run: xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
